name: Flutter checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iPhone release
        run: flutter build ios --release --no-codesign
      - name: Verify compiled detector is bundled
        run: test -d build/ios/iphoneos/Runner.app/RoadHazard.mlmodelc
      - name: Exercise Core ML through Apple Vision
        run: swift scripts/verify_model.swift ios/Runner/Models/RoadHazard.mlpackage
      - name: Run packaged detector test on iOS Simulator
        run: |
          flutter build ios --simulator --debug
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -only-testing:RunnerTests -resultBundlePath build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: build/ios-tests.xcresult
          if-no-files-found: ignore
