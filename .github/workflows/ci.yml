name: Flutter checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iPhone release
        run: flutter build ios --release --no-codesign
      - name: Verify compiled detector is bundled
        run: test -d build/ios/iphoneos/Runner.app/RoadHazard.mlmodelc
      - name: Exercise Core ML through Apple Vision
        run: swift scripts/verify_model.swift ios/Runner/Models/RoadHazard.mlpackage
